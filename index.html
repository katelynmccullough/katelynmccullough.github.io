
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katelyn | Links</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --black: #101010;
      --white: #f8f7f5;
      --red: #a80f29;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--white);
      color: var(--black);
      font-family: "DM Sans", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 45px 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 24px;
      background: var(--black);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Space Grotesk", sans-serif;
      font-size: 38px;
      font-weight: 700;
      border: 3px solid var(--red);
    }

    h1 {
      font-family: "Space Grotesk", sans-serif;
      font-size: 32px;
      letter-spacing: -1.5px;
      margin: 0;
    }

    h1 span { color: var(--red); }

    .subtitle {
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 13px 0 42px;
      color: #666;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .link {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 64px;
      padding: 18px 45px;
      background: var(--black);
      color: white;
      border: 1px solid var(--black);
      border-radius: 18px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.25s ease;
      box-shadow: 4px 4px 0 var(--red);
    }

    .link:hover {
      background: var(--red);
      border-color: var(--red);
      transform: translateY(-3px);
      box-shadow: 4px 7px 0 var(--black);
    }

    .arrow {
      position: absolute;
      right: 22px;
      font-size: 19px;
    }

    .footer {
      margin-top: 45px;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--red);
      font-weight: 700;
    }

    @media (max-width: 480px) {
      h1 { font-size: 29px; }
      .link { min-height: 60px; }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="avatar">KM</div>

    <h1>Katelyn<span>.</span></h1>
    <p class="subtitle">data science & digital things</p>

    <div class="links">

      <a class="link"
         href="https://www.linkedin.com/"
         target="_blank"
         rel="noopener noreferrer">
        Connect on LinkedIn
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="#"
         onclick="return false;">
        Katelyn Codes — Coming Soon
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://github.com/katelynmccullough"
         target="_blank"
         rel="noopener noreferrer">
        My GitHub
        <span class="arrow">↗</span>
      </a>

      <a class="link"
         href="https://www.tiktok.com/"
         target="_blank"
         rel="noopener noreferrer">
        Find Me on TikTok
        <span class="arrow">↗</span>
      </a>

    </div>

    <div class="footer">CONNECT WITH ME ♥</div>

  </main>
</body>
</html>
